# CI: lint + tests on Linux and Windows, release bundles, Arch package and install smoke tests.
# The heavy lifting lives in scripts/ci/*.sh so the pipeline is easy to port to another provider.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # Tauri system deps for Ubuntu (see OMNYRA_SPEC.md, step 0.0) + patchelf for AppImage.
  UBUNTU_DEPS: >-
    libwebkit2gtk-4.1-dev build-essential libssl-dev libayatana-appindicator3-dev
    librsvg2-dev libsecret-1-dev patchelf file

jobs:
  check:
    name: Check (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-22.04
            args: ""
          - name: Windows
            os: windows-2025
            args: --tests
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install system dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends $UBUNTU_DEPS
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: check
      - name: Lint and test
        shell: bash
        run: scripts/ci/check.sh ${{ matrix.args }}

  bundle:
    name: Bundle (${{ matrix.name }})
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          # Oldest supported Ubuntu runner: lower glibc => .deb/AppImage run on more distros.
          - name: Linux
            os: ubuntu-22.04
            bundles: deb,appimage
            artifact: omnyra-linux
          - name: Windows
            os: windows-2025
            bundles: msi,nsis
            artifact: omnyra-windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install system dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends $UBUNTU_DEPS
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: bundle
      - name: Build bundles
        shell: bash
        run: scripts/ci/bundle.sh ${{ matrix.bundles }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.artifact }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 14

  arch:
    name: Arch package (PKGBUILD)
    needs: check
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    steps:
      - name: Install build tools
        run: pacman -Syu --noconfirm --needed git rust nodejs npm namcap
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build package with makepkg
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          ver=$(sed -n 's/^pkgver=//p' packaging/arch/PKGBUILD)
          # Stand-in for the release tarball the PKGBUILD downloads (same name and prefix).
          git archive --format=tar.gz --prefix="omnyra-$ver/" -o "packaging/arch/omnyra-$ver.tar.gz" HEAD
          useradd -m builder
          echo 'builder ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/builder
          chown -R builder "$GITHUB_WORKSPACE"
          cd packaging/arch
          sudo -u builder makepkg --printsrcinfo | diff -u .SRCINFO - \
            || { echo "::error::.SRCINFO is stale: run 'makepkg --printsrcinfo > .SRCINFO'"; exit 1; }
          sudo -u builder makepkg --syncdeps --noconfirm
      - name: Lint with namcap
        working-directory: packaging/arch
        run: namcap PKGBUILD omnyra-*.pkg.tar.zst
      - name: Install and check shared libraries
        working-directory: packaging/arch
        run: |
          pacman -U --noconfirm omnyra-*.pkg.tar.zst
          if ldd /usr/bin/omnyra | grep 'not found'; then exit 1; fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: omnyra-arch
          path: packaging/arch/omnyra-*.pkg.tar.zst
          if-no-files-found: error
          retention-days: 14

  install-debian:
    name: Install .deb (Debian stable)
    needs: bundle
    runs-on: ubuntu-24.04
    container: debian:stable-slim
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: omnyra-linux
      - name: Install and check shared libraries
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ./*.deb
          if ldd /usr/bin/omnyra | grep 'not found'; then exit 1; fi

  install-windows:
    name: Install .msi / .exe (Windows)
    needs: bundle
    runs-on: windows-2025
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: omnyra-windows
      - name: Silent install (MSI, then NSIS)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          function Assert-Installed($where) {
            $exe = Get-ChildItem -Path $where -Recurse -Filter 'omnyra.exe' -ErrorAction SilentlyContinue | Select-Object -First 1
            if (-not $exe) { throw "omnyra.exe not found under $where" }
            Write-Host "Found $($exe.FullName)"
          }
          $msi = (Get-ChildItem *.msi | Select-Object -First 1).FullName
          $p = Start-Process msiexec.exe -ArgumentList '/i', "`"$msi`"", '/qn', '/norestart', '/l*v', 'msi.log' -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content msi.log -Tail 50; throw "msiexec exit $($p.ExitCode)" }
          Assert-Installed "$env:ProgramFiles\Omnyra"
          $p = Start-Process msiexec.exe -ArgumentList '/x', "`"$msi`"", '/qn', '/norestart' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "msi uninstall exit $($p.ExitCode)" }
          $nsis = (Get-ChildItem *-setup.exe | Select-Object -First 1).FullName
          $p = Start-Process $nsis -ArgumentList '/S' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "NSIS installer exit $($p.ExitCode)" }
          Assert-Installed "$env:LOCALAPPDATA\Omnyra"
