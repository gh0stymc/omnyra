[package]
name = "omnyra"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "omnyra_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
omnyra-core = { path = "../crates/omnyra-core" }
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
tauri-specta = { version = "=2.0.0-rc.29", features = ["derive", "typescript"] }
specta.workspace = true
specta-typescript = "0.0.15"
serde.workspace = true
serde_json.workspace = true
time.workspace = true
tracing = "0.1"
tokio.workspace = true
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "ansi"] }
